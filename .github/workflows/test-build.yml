name: Publish SceneSlate release

# Routine commits never run hosted jobs. Build only after a release is published.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: sceneslate-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NumPy acceleration
        run: python -m pip install numpy
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller and icon verifier
        run: python -m pip install pyinstaller pefile
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --clean --onefile --windowed --noconfirm --name "SceneSlate-$env:GITHUB_REF_NAME" --paths . --icon sceneslate_logo.ico --add-data 'sceneslate_icon.png;.' --add-data 'sceneslate_logo.ico;.' scene_slate.pyw
      - name: Verify embedded Windows EXE icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/verify_windows_icon.py "dist/SceneSlate-$env:GITHUB_REF_NAME.exe" sceneslate_logo.ico
      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . --add-data 'sceneslate_icon.png:.' --add-data 'sceneslate_logo.ico:.' scene_slate.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SceneSlate-$env:GITHUB_REF_NAME.exe" -DestinationPath "SceneSlate-$env:GITHUB_REF_NAME-windows-x64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "SceneSlate-$GITHUB_REF_NAME-linux-x64.tar.gz" -C dist SceneSlate
      - name: Publish Windows binary directly to GitHub Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "SceneSlate-$env:GITHUB_REF_NAME-windows-x64.zip" --clobber
      - name: Publish Linux binary directly to GitHub Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "SceneSlate-$GITHUB_REF_NAME-linux-x64.tar.gz" --clobber
