name: Test & build SceneSlate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build standalone binary (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.pyw
      - name: Build standalone binary (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.py
      - uses: actions/upload-artifact@v4
        with:
          name: SceneSlate-${{ runner.os }}
          path: dist/SceneSlate*
