name: Publish SceneSlate release

# One temporary push hook cleans up artifacts left by the old workflow.
# After cleanup this hook will be removed; normal commits will not run CI.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/test-build.yml

permissions: {}

concurrency:
  group: sceneslate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup-legacy-artifacts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete previously uploaded Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                echo "Deleting Actions artifact $artifact_id"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              fi
            done

  build-and-publish:
    name: Release (${{ matrix.os }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.pyw
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SceneSlate.exe -DestinationPath "SceneSlate-$env:GITHUB_REF_NAME-windows-x64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "SceneSlate-$GITHUB_REF_NAME-linux-x64.tar.gz" -C dist SceneSlate
      - name: Publish Windows binary to GitHub Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "SceneSlate-$env:GITHUB_REF_NAME-windows-x64.zip" --clobber
      - name: Publish Linux binary to GitHub Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "SceneSlate-$GITHUB_REF_NAME-linux-x64.tar.gz" --clobber
