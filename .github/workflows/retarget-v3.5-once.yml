name: Fix SceneSlate 3.5 draft target
on:
  push:
    branches: [main]
    paths: [.github/workflows/retarget-v3.5-once.yml]
permissions: {}
jobs:
  retarget:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set the source commit of the unpublished v3.5.0 draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/454622642" \
            -f target_commitish=afbe28078b2beeace9266fbc5899e8af7caefd2d \
            -q '{tag: .tag_name, target: .target_commitish, draft: .draft}'
