name: One-time SceneSlate v3.10.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v3.10-once.yml

permissions: {}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare release draft from tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v3.10.0 --repo "$GITHUB_REPOSITORY" --target 681cd42679b8411470f5891ec0d7f17ae896f208 --title "SceneSlate 3.10.0" --draft --notes "Quick video playback with configurable player, Space in Sync Editor, localized ratings G/R/X, explicit hierarchy columns, keyboard navigation in link selector, compact logo, and spectral evidence for more robust synchronization. Existing manual and OK results remain intact. FFmpeg/ffprobe are required for audio synchronization. NumPy is bundled. XML remains frame-based."
  build-and-publish:
    needs: draft-release
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 681cd42679b8411470f5891ec0d7f17ae896f208
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NumPy acceleration
        run: python -m pip install numpy
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Install FFmpeg on Windows if unavailable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          ffmpeg -version
          ffprobe -version
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller and icon verifier
        run: python -m pip install pyinstaller pefile
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --clean --onefile --windowed --noconfirm --name "SceneSlate-v3.10.0" --paths . --icon sceneslate_logo.ico --add-data 'sceneslate_icon.png;.' --add-data 'sceneslate_logo.ico;.' scene_slate.pyw
      - name: Verify embedded Windows EXE icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/verify_windows_icon.py "dist/SceneSlate-v3.10.0.exe" sceneslate_logo.ico
      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . --add-data 'sceneslate_icon.png:.' --add-data 'sceneslate_logo.ico:.' scene_slate.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SceneSlate-v3.10.0.exe" -DestinationPath "SceneSlate-v3.10.0-windows-x64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "SceneSlate-v3.10.0-linux-x64.tar.gz" -C dist SceneSlate
      - name: Publish Windows binary directly to GitHub Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v3.10.0" "SceneSlate-v3.10.0-windows-x64.zip" --clobber
      - name: Publish Linux binary directly to GitHub Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v3.10.0" "SceneSlate-v3.10.0-linux-x64.tar.gz" --clobber

  publish-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish after both verified builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v3.10.0 --repo "$GITHUB_REPOSITORY" --draft=false
