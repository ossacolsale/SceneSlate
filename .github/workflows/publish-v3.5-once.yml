name: One-time SceneSlate 3.5 release

# Temporary workflow; direct GitHub Release assets, no Actions artifacts.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v3.5-once.yml]

permissions: {}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft/release already exists."
            exit 0
          fi
          cat >/tmp/release_notes.md <<'NOTES'
          ## SceneSlate 3.5.0 — Manual synchronization editor

          - Bilingual waveform editing for camera and external recorder audio, waveform dragging and ±1/10/100 ms or 1 s nudges.
          - Stereo audition with camera left, recorder right; mixed and solo listening.
          - Manual approval with persistent OK, source fingerprint and worker-race protection.
          - Compatible with existing catalogs, filters and CSV/FCP7 XML exports; original media are not modified.

          **Requirements:** FFmpeg and ffprobe are required; SceneSlate can offer a user-approved Windows installation. On Linux, install FFmpeg and ffplay, paplay or aplay. FCP7 XML exports place audio at whole video-frame boundaries, so verify alignment in Resolve.
          NOTES
          gh release create v3.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target df73aae5c6ff24ca9fee7a05967f5a2112bc4043 \
            --title "SceneSlate 3.5.0" \
            --notes-file /tmp/release_notes.md \
            --draft

  build:
    needs: draft-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df73aae5c6ff24ca9fee7a05967f5a2112bc4043
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux test requirements
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.pyw
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SceneSlate.exe -DestinationPath "SceneSlate-v3.5.0-windows-x64.zip"
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf SceneSlate-v3.5.0-linux-x64.tar.gz -C dist SceneSlate
      - name: Attach Windows binary directly to Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.5.0 SceneSlate-v3.5.0-windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
      - name: Attach Linux binary directly to Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.5.0 SceneSlate-v3.5.0-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish after both builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v3.5.0 --repo "$GITHUB_REPOSITORY" --draft=false
