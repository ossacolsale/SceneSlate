name: Publish SceneSlate 3.11.0 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v311-once.yml

permissions: {}

concurrency:
  group: sceneslate-v311-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.11.0 --repo "$GITHUB_REPOSITORY" --target faa05cc85f3929297b56722663e4ed117fc227ff --draft --title "SceneSlate 3.11.0" --notes "Quick sync review (P), immediate manual confirmation, reverse media navigation with linked group indicators, compact controls and multiband audio consensus. Original media are not modified; automatic accuracy depends on the recordings."
  build-and-publish:
    needs: draft
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: faa05cc85f3929297b56722663e4ed117fc227ff
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NumPy acceleration
        run: python -m pip install numpy
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller and icon verifier
        run: python -m pip install pyinstaller pefile
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --clean --onefile --windowed --noconfirm --name "SceneSlate-v3.11.0" --paths . --icon sceneslate_logo.ico --add-data 'sceneslate_icon.png;.' --add-data 'sceneslate_logo.ico;.' scene_slate.pyw
      - name: Verify embedded Windows EXE icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/verify_windows_icon.py "dist/SceneSlate-v3.11.0.exe" sceneslate_logo.ico
      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . --add-data 'sceneslate_icon.png:.' --add-data 'sceneslate_logo.ico:.' scene_slate.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SceneSlate-v3.11.0.exe" -DestinationPath "SceneSlate-v3.11.0-windows-x64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "SceneSlate-v3.11.0-linux-x64.tar.gz" -C dist SceneSlate
      - name: Publish Windows binary directly to GitHub Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v3.11.0" "SceneSlate-v3.11.0-windows-x64.zip" --clobber
      - name: Publish Linux binary directly to GitHub Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v3.11.0" "SceneSlate-v3.11.0-linux-x64.tar.gz" --clobber
  publish:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify both assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.11.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx SceneSlate-v3.11.0-windows-x64.zip
          gh release view v3.11.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx SceneSlate-v3.11.0-linux-x64.tar.gz
          gh release edit v3.11.0 --repo "$GITHUB_REPOSITORY" --draft=false
