name: Publish SceneSlate v3.9.0 once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v3.9-once.yml
permissions: {}
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release from tested 3.9.0 sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.9.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.9.0 release already exists; no duplicate"
            exit 0
          fi
          cat >/tmp/sceneslate-release-notes.md <<'NOTES'
          ## SceneSlate 3.9.0

          - Windows standalone executable uses a dedicated SceneSlate icon (not the Python icon), a version-specific filename, and a build-time PE icon resource verification.
          - Sync Editor displays a moving playhead while listening, follows the currently played audio, and automatically scrolls the waveform view. Longer recordings load new waveform windows in the background.
          - When a shot has sub-shots, new takes/audio/video must be attached to a sub-shot. Drag-and-drop and copy/paste cannot circumvent this rule. Existing legacy shot-level takes remain intact.
          - Linked scenes/shots/sub-shots list all destinations after the media counters; a tooltip reveals the complete list if the row is clipped.
          - English/Italian interface; no original audio/video files are altered.

          **Windows:** extract the ZIP and run `SceneSlate-v3.9.0.exe`; a new executable filename also avoids stale Windows Explorer icon caching.
          **Audio sync:** FFmpeg/ffprobe are still necessary. Playback cursor follows the playback clock approximately; it is not a sample-accurate device clock. XML/FCP7 may still round audio placement to timeline frames.

          Windows and Linux binaries are built, tested and attached directly by the Release workflow. No temporary GitHub Actions artifacts.
          NOTES
          gh release create v3.9.0 --repo "$GITHUB_REPOSITORY" \
            --target 129aaeacaa748a9d161181197962ac9ce653fff5 \
            --title "SceneSlate 3.9.0" \
            --notes-file /tmp/sceneslate-release-notes.md
