name: One-time SceneSlate 3.3 release

# Temporary, self-contained release build; remove this workflow after success.
# Never uses actions/upload-artifact or caches; downloads live on the Release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v3.3-once.yml

permissions: {}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create v3.3.0 draft from the pre-workflow commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if gh release view v3.3.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.3.0 already exists; refusing to overwrite an existing release"
            exit 1
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          ## SceneSlate 3.3.0

          - Background waveform synchronization of camera scratch audio with paired external audio (FFmpeg/ffprobe required).
          - Per-take and aggregate scene/shot/sub-shot sync status: OK, REVIEW, KO, WAIT, SINGLE; filter unsynchronized items.
          - CSV metadata plus Final Cut Pro 7 XML review timelines per take, per shot, and per scene.
          - English/Italian UI, persistent catalog and session settings, non-destructive media references.

          **Important:** XML contains editable timelines rather than native synced Media Pool sources. Verify synchronization by listening and test XML imports in a copy of your DaVinci Resolve project. External FFmpeg/ffprobe binaries are not bundled.
          NOTES
          gh release create v3.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BASE_COMMIT" \
            --title "SceneSlate 3.3.0" \
            --notes-file /tmp/release-notes.md \
            --draft

  build:
    needs: draft-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: v3.3.0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Test Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build Windows standalone
        if: runner.os == 'Windows'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.pyw
      - name: Build Linux standalone
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.py
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SceneSlate.exe -DestinationPath "SceneSlate-v3.3.0-windows-x64.zip"
      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "SceneSlate-v3.3.0-linux-x64.tar.gz" -C dist SceneSlate
      - name: Upload Windows directly to Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.3.0 "SceneSlate-v3.3.0-windows-x64.zip" --repo "$env:GITHUB_REPOSITORY" --clobber
      - name: Upload Linux directly to Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.3.0 "SceneSlate-v3.3.0-linux-x64.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after both tested builds succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v3.3.0 --repo "$GITHUB_REPOSITORY" --draft=false
