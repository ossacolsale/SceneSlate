name: Build SceneSlate v3.8.0 once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v38-once.yml
permissions: {}
jobs:
  build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 0a13835d3276e14d70d2ccdba00790ff0ebda5f6
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Test Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build Windows with embedded icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . --icon sceneslate_logo.ico --add-data 'sceneslate_icon.png;.' --add-data 'sceneslate_logo.ico;.' scene_slate.pyw
      - name: Build Linux
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . --add-data 'sceneslate_icon.png:.' --add-data 'sceneslate_logo.ico:.' scene_slate.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SceneSlate.exe -DestinationPath "SceneSlate-v3.8.0-windows-x64.zip"
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf "SceneSlate-v3.8.0-linux-x64.tar.gz" -C dist SceneSlate
      - name: Attach Windows directly to Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.8.0 "SceneSlate-v3.8.0-windows-x64.zip" --repo "$env:GITHUB_REPOSITORY" --clobber
      - name: Attach Linux directly to Release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.8.0 "SceneSlate-v3.8.0-linux-x64.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
