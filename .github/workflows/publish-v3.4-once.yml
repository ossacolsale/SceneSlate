name: One-time SceneSlate 3.4.0 release

# Temporary workflow; no Actions artifacts or caches are stored.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v3.4-once.yml

permissions: {}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft from tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing v3.4.0 draft"
            exit 0
          fi
          cat > /tmp/sceneslate-notes.md <<'NOTES'
          ## SceneSlate 3.4.0 — Optional FFmpeg setup

          - Windows users can approve downloading FFmpeg and ffprobe from the Windows build vendor linked by ffmpeg.org. SceneSlate verifies the vendor-published SHA-256 checksum and installs the two tools into the user's local configuration directory.
          - No administrator rights, PATH modifications, or modifications to media files.
          - Progress and cancellation, English/Italian controls, and **Do not ask again** setting. Setup is accessible at any time from Tools → FFmpeg setup.
          - Synchronizations previously marked KO solely because the dependencies were missing are retried after installation.
          - All previous scene/sub-shot catalogs, XML/CSV exports, synchronization and status filters remain available.

          FFmpeg/ffprobe are **not bundled**. This build requires an internet connection only if you opt in to the installer, and downloading a third-party binary requires your explicit approval. Linux users should install FFmpeg through their distribution's package manager.
          NOTES
          gh release create v3.4.0 --repo "$GITHUB_REPOSITORY" --target "4d935e78c26e5881b25299a6447fdd9cc1c01aa0" \
            --title "SceneSlate 3.4.0" --notes-file /tmp/sceneslate-notes.md --draft

  build:
    needs: draft-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout v3.4.0 source commit
        uses: actions/checkout@v5
        with:
          ref: 4d935e78c26e5881b25299a6447fdd9cc1c01aa0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Run Windows unit and GUI tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run Linux unit and GUI tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.pyw
      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . scene_slate.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SceneSlate.exe -DestinationPath "SceneSlate-v3.4.0-windows-x64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf SceneSlate-v3.4.0-linux-x64.tar.gz -C dist SceneSlate
      - name: Upload Windows binary directly to draft Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.4.0 SceneSlate-v3.4.0-windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
      - name: Upload Linux binary directly to draft Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.4.0 SceneSlate-v3.4.0-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only when Windows and Linux builds passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v3.4.0 --repo "$GITHUB_REPOSITORY" --draft=false
