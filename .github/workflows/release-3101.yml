name: Publish SceneSlate v3.10.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-3101.yml']
permissions: {}
concurrency:
  group: sceneslate-release-v3.10.1
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release for tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.10.1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create v3.10.1 -R "$GITHUB_REPOSITORY" --draft --target deb477798221b2df59924139d8af08953af1e1fc --title "SceneSlate 3.10.1" --notes "Patch: flat scene/shot/sub-shot list, mouse-wheel link selector, Windows video playback and player selection fixes, take-list playback menu, safer globally corroborated audio sync, and Clear content with Undo. No original media files are modified."
  build-and-publish:
    needs: prepare
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: deb477798221b2df59924139d8af08953af1e1fc
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NumPy acceleration
        run: python -m pip install numpy
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Install PyInstaller and icon verifier
        run: python -m pip install pyinstaller pefile
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --clean --onefile --windowed --noconfirm --name "SceneSlate-v3.10.1" --paths . --icon sceneslate_logo.ico --add-data 'sceneslate_icon.png;.' --add-data 'sceneslate_logo.ico;.' scene_slate.pyw
      - name: Verify embedded Windows EXE icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/verify_windows_icon.py "dist/SceneSlate-v3.10.1.exe" sceneslate_logo.ico
      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: python -m PyInstaller --onefile --windowed --noconfirm --name SceneSlate --paths . --add-data 'sceneslate_icon.png:.' --add-data 'sceneslate_logo.ico:.' scene_slate.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SceneSlate-v3.10.1.exe" -DestinationPath "SceneSlate-v3.10.1-windows-x64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "SceneSlate-v3.10.1-linux-x64.tar.gz" -C dist SceneSlate
      - name: Publish Windows binary directly to GitHub Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v3.10.1" "SceneSlate-v3.10.1-windows-x64.zip" --clobber
      - name: Publish Linux binary directly to GitHub Release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v3.10.1" "SceneSlate-v3.10.1-linux-x64.tar.gz" --clobber

  finalize:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release and remove obsolete releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.10.1 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx SceneSlate-v3.10.1-windows-x64.zip
          gh release view v3.10.1 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx SceneSlate-v3.10.1-linux-x64.tar.gz
          gh release edit v3.10.1 -R "$GITHUB_REPOSITORY" --draft=false --latest
          # User-requested removal of releases older than 3.9.0. Keep Git tags.
          for tag in v3.3.0 v3.4.0 v3.5.0 v3.6.0 v3.7.0 v3.8.0; do
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes
            fi
          done
